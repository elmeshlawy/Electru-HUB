<div class="eh-empty-state text-center py-5 px-3">
  <div class="empty-icon-circle mx-auto mb-3">
    <i class="bi" [class]="icon()"></i>
  </div>
  <h4 class="fw-bold text-navy mb-2">{{ title() }}</h4>
  <p class="text-muted max-w-450 mx-auto mb-4">{{ description() }}</p>

  @if (actionText()) {
    @if (actionRoute()) {
      <a [routerLink]="actionRoute()" class="btn btn-primary-blue">
        {{ actionText() }}
      </a>
    } @else {
      <button type="button" class="btn btn-primary-blue" (click)="onActionClick()">
        {{ actionText() }}
      </button>
    }
  }
</div>
