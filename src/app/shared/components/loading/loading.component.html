<div
  class="eh-loading-wrapper d-flex flex-column align-items-center justify-content-center p-4"
  [class.fullscreen]="fullscreen()"
>
  <div
    class="spinner-border text-primary-blue mb-3"
    [class.spinner-border-sm]="size() === 'sm'"
    [class.spinner-lg]="size() === 'lg'"
    role="status"
  >
    <span class="visually-hidden">Loading...</span>
  </div>
  @if (message()) {
    <p class="text-muted text-sm mb-0 text-center fw-medium">{{ message() }}</p>
  }
</div>
